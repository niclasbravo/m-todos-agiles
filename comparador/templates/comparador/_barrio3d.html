<section class="barrio" id="barrio" aria-labelledby="barrio-titulo" hidden>
  <div class="barrio-cab">
    <h2 id="barrio-titulo">Tu plata como barrio</h2>
    <p class="leyenda barrio-ley">
      <span><i class="sw" style="background:#d9cfbf"></i>Pisos que pagas tú</span>
      <span><i class="sw" style="background:#ffc94d"></i>Pisos que paga la ganancia</span>
      <span><i class="sw" style="background:#ff5a4e"></i>Valor real, en pesos de hoy</span>
    </p>
  </div>
  <div class="escena" id="escena" aria-hidden="true">
    <div class="etiquetas" id="etiquetas"></div>
  </div>
  <div class="tiempo">
    <button type="button" class="play" id="play" aria-label="Reproducir el crecimiento">▶</button>
    <label for="anio" class="anio-txt" id="anio-txt">Hoy</label>
    <input type="range" id="anio" min="0" max="12" step="1" value="12">
  </div>
  <div class="ficha" id="ficha" aria-live="polite"></div>
</section>
<style>
.barrio{background:#101318;color:#f5f5f5;border:1px solid #2a2a2e;border-radius:12px;margin:0 0 28px;overflow:hidden}
.barrio-cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 20px;padding:20px 24px 0}
.barrio h2{color:#f5f5f5;margin:0}
.barrio-ley{margin:0;color:#b4b4b4}
.escena{position:relative;height:440px;margin-top:12px;touch-action:pan-y;cursor:pointer}
.escena canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.etiquetas{position:absolute;inset:0;pointer-events:none}
.etq{position:absolute;transform:translate(-50%,-100%);font-size:13px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 1px 0 #000,0 0 3px #000}
.etq.on{color:#ffc94d}
.tiempo{display:flex;align-items:center;gap:14px;padding:12px 24px;border-top:1px solid #2a2a2e}
.tiempo .play{width:44px;min-height:44px;padding:0;flex:none;background:#f5f5f5;color:#101318;border:0;border-radius:6px;font-size:16px}
.anio-txt{margin:0;color:#f5f5f5;font-size:14px;font-weight:600;min-width:72px;font-variant-numeric:tabular-nums}
.tiempo input[type=range]{flex:1;height:44px;border:0;padding:0;background:transparent;accent-color:#ffc94d}
.ficha{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;border-top:1px solid #2a2a2e;padding:14px 24px 18px;font-size:13px;color:#b4b4b4;font-variant-numeric:tabular-nums;min-height:58px}
.ficha strong{color:#f5f5f5;font-size:15px}
.ficha .monto{color:#ffc94d;font-size:22px;font-weight:700}
@media(max-width:600px){
  .barrio{border-radius:8px}
  .barrio-cab{padding:16px 16px 0}
  .escena{height:360px}
  .etq:not(.on){display:none}
  .tiempo{padding:10px 16px}
  .ficha{padding:12px 16px 16px;gap:2px 12px}
}
</style>
{{ escena|json_script:"datos-barrio" }}
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}
</script>
<script type="module">
// Barrio low poly con la cordillera de fondo: cada instrumento es un edificio cuyos pisos crecen con la
// plata (los pisos con luz dorada los paga la ganancia). Se ve pixelado con RenderPixelatedPass.
// Si WebGL o la librería no cargan, la sección queda oculta y siguen las barras de siempre.
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPixelatedPass } from "three/addons/postprocessing/RenderPixelatedPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const datos = JSON.parse(document.getElementById("datos-barrio")?.textContent || "null");
const caja = document.getElementById("barrio");
if (datos && datos.inst.length && caja) iniciar();

function iniciar() {
  const $ = (id) => document.getElementById(id);
  const escena = $("escena"), capa = $("etiquetas"), ficha = $("ficha");
  const rango = $("anio"), anioTxt = $("anio-txt"), play = $("play");
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: false }); } catch (e) { return; }
  caja.hidden = false;
  const quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;
  renderer.setPixelRatio(1); // el pase pixelado hace su propia resolución baja
  renderer.shadowMap.enabled = true;
  renderer.debug.checkShaderErrors = false; // evita avisos del compilador de la GPU en la consola
  escena.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const camara = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
  const composer = new EffectComposer(renderer);
  const pixel = new RenderPixelatedPass(3, scene, camara);
  pixel.normalEdgeStrength = 0.35;
  pixel.depthEdgeStrength = 0.5;
  composer.addPass(pixel);
  composer.addPass(new OutputPass());

  // Luz: sol que cae hacia el atardecer a medida que avanzan los años.
  const sol = new THREE.DirectionalLight(0xfff1d6, 2.6);
  sol.castShadow = true;
  sol.shadow.mapSize.set(1024, 1024);
  Object.assign(sol.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 60 });
  const cielo = new THREE.HemisphereLight(0xbfe3ff, 0x6b5a45, 1.1);
  scene.add(sol, sol.target, cielo);

  const lambert = (color, extra) => new THREE.MeshLambertMaterial({ color, flatShading: true, ...extra });
  const sombra = (m, recibe = true) => { m.castShadow = true; m.receiveShadow = recibe; return m; };

  // Suelo, vereda y calle.
  const suelo = new THREE.Mesh(new THREE.BoxGeometry(60, 0.4, 40), lambert(0x8fae6b));
  suelo.position.y = -0.2; suelo.receiveShadow = true; scene.add(suelo);
  const calle = new THREE.Mesh(new THREE.BoxGeometry(60, 0.42, 2.2), lambert(0x3d4048));
  calle.position.set(0, -0.19, 3.6); calle.receiveShadow = true; scene.add(calle);
  const vereda = new THREE.Mesh(new THREE.BoxGeometry(60, 0.46, 0.9), lambert(0xc9c3b8));
  vereda.position.set(0, -0.17, 2.05); vereda.receiveShadow = true; scene.add(vereda);
  for (let x = -28; x < 28; x += 2) {
    const linea = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.44, 0.1), lambert(0xf2efe6));
    linea.position.set(x, -0.18, 3.6); scene.add(linea);
  }

  // Cordillera de los Andes: conos de pocas caras con nieve en la punta.
  const roca = lambert(0x8a8f99), nieve = lambert(0xf4f6f8);
  [[-22, 4.6, 4.6], [-16, 5.6, 5], [-10, 4.9, 4.6], [-4, 6.2, 5.4], [2, 5.2, 4.8], [8, 6.6, 5.6], [14, 5.4, 5], [20, 4.8, 4.6], [26, 5.6, 5]].forEach(([x, alto, ancho], i) => {
    const cerro = new THREE.Mesh(new THREE.ConeGeometry(ancho, alto, 5 + (i % 2)), roca);
    cerro.position.set(x, alto / 2 - 0.3, -15 - (i % 2) * 2.5);
    cerro.rotation.y = i * 0.7;
    scene.add(cerro);
    const tapa = new THREE.Mesh(new THREE.ConeGeometry(ancho * 0.34, alto * 0.34, 5 + (i % 2)), nieve);
    tapa.position.set(x, alto - alto * 0.17 - 0.3, cerro.position.z);
    tapa.rotation.y = cerro.rotation.y;
    scene.add(tapa);
  });

  // Árboles en la vereda y autos que pasan.
  const hoja = lambert(0x4f7d3a), tronco = lambert(0x6b4a2f);
  const arboles = [];
  for (let x = -13; x <= 13; x += 2.6) {
    const t = sombra(new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.5, 5), tronco));
    const c = sombra(new THREE.Mesh(new THREE.IcosahedronGeometry(0.42, 0), hoja));
    t.position.set(x, 0.25, 2.1); c.position.set(x, 0.75, 2.1);
    scene.add(t, c); arboles.push(t, c);
  }
  const autos = [0xd64545, 0x3b82c4, 0xf2c14e, 0xeeeeee].map((color, i) => {
    const g = new THREE.Group();
    const cuerpo = sombra(new THREE.Mesh(new THREE.BoxGeometry(1, 0.32, 0.5), lambert(color)));
    const techo = sombra(new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.24, 0.44), lambert(0x2a3442)));
    cuerpo.position.y = 0.26; techo.position.set(-0.05, 0.54, 0);
    g.add(cuerpo, techo);
    g.userData = { carril: i % 2 ? 3.1 : 4.1, dir: i % 2 ? 1 : -1, x: -14 + i * 7.5, vel: 2.2 + i * 0.4 };
    g.rotation.y = g.userData.dir > 0 ? 0 : Math.PI;
    scene.add(g);
    return g;
  });

  // Fachadas con ventanas, dibujadas en un canvas chico y escaladas sin suavizar.
  function fachada(pared, ventana) {
    const c = document.createElement("canvas"); c.width = c.height = 16;
    const g = c.getContext("2d");
    g.fillStyle = pared; g.fillRect(0, 0, 16, 16);
    g.fillStyle = ventana;
    [2, 7, 12].forEach((x) => g.fillRect(x, 4, 3, 7));
    const t = new THREE.CanvasTexture(c);
    t.magFilter = t.minFilter = THREE.NearestFilter;
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }
  const luces = (() => {
    const c = document.createElement("canvas"); c.width = c.height = 16;
    const g = c.getContext("2d"); g.fillStyle = "#000"; g.fillRect(0, 0, 16, 16);
    g.fillStyle = "#fff"; [2, 7, 12].forEach((x) => g.fillRect(x, 4, 3, 7));
    const t = new THREE.CanvasTexture(c); t.magFilter = t.minFilter = THREE.NearestFilter; return t;
  })();
  const matBase = new THREE.MeshLambertMaterial({ map: fachada("#ffffff", "#3a4656") });
  const matOro = new THREE.MeshLambertMaterial({
    map: fachada("#f3e4c0", "#ffc94d"), emissiveMap: luces, emissive: 0xffb733, emissiveIntensity: 0.6,
  });

  // Un piso = un bloque. La torre más alta del último año tiene MAXP pisos.
  const MAXP = 20, PISO = 0.36, ANCHO = 1.15;
  const inst = datos.inst, n = inst.length, cortes = datos.meses.length;
  const maximo = Math.max(...inst.map((d) => d.puntos[cortes - 1][1])) || 1;
  const geoPiso = new THREE.BoxGeometry(ANCHO, PISO * 0.98, ANCHO);
  const mBase = sombra(new THREE.InstancedMesh(geoPiso, matBase, n * MAXP));
  const mOro = sombra(new THREE.InstancedMesh(geoPiso, matOro, n * MAXP));
  scene.add(mBase, mOro);
  const tonos = [0xe9dccb, 0xc9dbe6, 0xd5e2c8, 0xeac9b8, 0xd9d4e0, 0xe6e0c2, 0xcfd6d9].map((c) => new THREE.Color(c));
  const techos = inst.map(() => {
    const g = new THREE.Group();
    const losa = sombra(new THREE.Mesh(new THREE.BoxGeometry(ANCHO + 0.12, 0.12, ANCHO + 0.12), lambert(0x59606b)));
    const estanque = sombra(new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.3, 6), lambert(0x8d96a3)));
    estanque.position.set(0.25, 0.2, -0.2);
    g.add(losa, estanque); scene.add(g); return g;
  });
  const marcas = inst.map(() => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(ANCHO + 0.2, 0.07, ANCHO + 0.2),
      new THREE.MeshBasicMaterial({ color: 0xff5a4e }));
    scene.add(m); return m;
  });
  const duenoBase = [], duenoOro = [];

  const etq = inst.map((d) => {
    const e = document.createElement("div"); e.className = "etq"; capa.append(e); return e;
  });

  // Posiciones: una fila en pantallas anchas, dos filas en angostas.
  let pos = [];
  function ubicar() {
    const w = escena.clientWidth, h = escena.clientHeight;
    renderer.setSize(w, h, false);
    composer.setSize(w, h);
    pixel.setPixelSize(w < 600 ? 2 : 3);
    const dosFilas = w / h < 1.3, sep = 1.85;
    const enFrente = dosFilas ? Math.ceil(n / 2) : n;
    pos = inst.map((_, i) => {
      const frente = i < enFrente, k = frente ? i : i - enFrente, cuantos = frente ? enFrente : n - enFrente;
      return new THREE.Vector3((k - (cuantos - 1) / 2) * sep + (frente ? 0 : sep / 2), 0, frente ? 0 : -2.2);
    });
    // Cámara isométrica que encuadra edificios, vereda y la torre más alta.
    camara.position.set(6, 12, 24);
    camara.lookAt(0, MAXP * PISO * 0.32, 0);
    camara.updateMatrixWorld();
    const anchoFila = enFrente * sep;
    const caja3 = new THREE.Box3(new THREE.Vector3(-anchoFila / 2 - 0.6, 0, -2.8), new THREE.Vector3(anchoFila / 2 + 0.6, MAXP * PISO + 0.9, 3.2));
    const inv = camara.matrixWorldInverse, v = new THREE.Vector3();
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (let k = 0; k < 8; k++) {
      v.set(k & 1 ? caja3.max.x : caja3.min.x, k & 2 ? caja3.max.y : caja3.min.y, k & 4 ? caja3.max.z : caja3.min.z).applyMatrix4(inv);
      x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x); y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y);
    }
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    let mw = (x1 - x0) / 2 * 1.06, mh = (y1 - y0) / 2 * 1.2;
    if (mw / mh > w / h) mh = mw / (w / h); else mw = mh * (w / h);
    Object.assign(camara, { left: cx - mw, right: cx + mw, top: cy + mh + mh * 0.06, bottom: cy - mh + mh * 0.06 });
    camara.updateProjectionMatrix();
    sol.target.position.set(0, 0, 0);
  }
  ubicar();
  new ResizeObserver(ubicar).observe(escena);

  // Valores en un momento continuo (0 = hoy, cortes-1 = fin del plazo), interpolando entre cortes.
  function valor(d, f) {
    const a = Math.floor(f), b = Math.min(cortes - 1, a + 1), u = f - a;
    return d.puntos[a].map((x, k) => x + (d.puntos[b][k] - x) * u);
  }
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(1, 1, 1), p = new THREE.Vector3();
  const blanco = new THREE.Color(1, 1, 1), resalte = new THREE.Color();
  let sel = inst.reduce((b, d, i) => (d.puntos[cortes - 1][1] > inst[b].puntos[cortes - 1][1] ? i : b), 0);
  let momento = quieto ? cortes - 1 : 0;

  function construir(f) {
    let nb = 0, no = 0;
    inst.forEach((d, i) => {
      const [aportado, nominal, real] = valor(d, f);
      const total = Math.max(1, Math.round((nominal / maximo) * MAXP));
      const base = Math.min(total, Math.max(1, Math.round((aportado / maximo) * MAXP)));
      const tono = resalte.copy(tonos[i % tonos.length]);
      if (i === sel) tono.lerp(blanco, 0.45);
      for (let k = 0; k < total; k++) {
        p.set(pos[i].x, PISO / 2 + k * PISO, pos[i].z);
        m4.compose(p, q, s);
        if (k < base) { mBase.setMatrixAt(nb, m4); mBase.setColorAt(nb, tono); duenoBase[nb++] = i; }
        else { mOro.setMatrixAt(no, m4); mOro.setColorAt(no, i === sel ? resalte.setRGB(1.25, 1.2, 1.1) : blanco); duenoOro[no++] = i; }
      }
      techos[i].position.set(pos[i].x, total * PISO + 0.06, pos[i].z);
      marcas[i].position.set(pos[i].x, Math.max(0.05, (real / maximo) * MAXP * PISO), pos[i].z);
      d.ahora = { aportado, nominal, real, total };
    });
    mBase.count = nb; mOro.count = no;
    [mBase, mOro].forEach((m) => { m.instanceMatrix.needsUpdate = true; if (m.instanceColor) m.instanceColor.needsUpdate = true; });

    // De mañana a atardecer: el cielo se oscurece y las ventanas de la ganancia se encienden.
    const u = f / (cortes - 1);
    scene.background = new THREE.Color(0x9fd3ef).lerp(new THREE.Color(0xe9a37a), Math.min(1, u * 1.6)).lerp(new THREE.Color(0x2b3557), Math.max(0, u - 0.55) * 1.4);
    sol.intensity = 2.6 - u * 1.2;
    sol.color.set(0xfff1d6).lerp(new THREE.Color(0xff9a5c), u);
    sol.position.set(10 - u * 18, 16 - u * 9, 10);
    cielo.intensity = 1.2 - u * 0.3;
    matOro.emissiveIntensity = 0.5 + u * 1.3;

    const meses = Math.round(datos.meses[Math.floor(f)] + (datos.meses[Math.min(cortes - 1, Math.floor(f) + 1)] - datos.meses[Math.floor(f)]) * (f - Math.floor(f)));
    anioTxt.textContent = meses === 0 ? "Hoy" : meses % 12 === 0 ? `Año ${meses / 12}` : `Mes ${meses}`;
    inst.forEach((d, i) => { etq[i].textContent = corto(d.ahora.nominal); etq[i].classList.toggle("on", i === sel); });
    mostrar();
  }

  function mostrar() {
    const d = inst[sel], a = d.ahora;
    ficha.innerHTML = "";
    const nom = document.createElement("strong"); nom.textContent = d.nombre;
    const monto = document.createElement("span"); monto.className = "monto"; monto.textContent = clp(a.nominal);
    const det = document.createElement("span");
    det.textContent = `Pones ${clp(a.aportado)} · Ganancia ${clp(a.nominal - a.aportado)} · Valor real ${clp(a.real)} · Riesgo ${d.riesgo}`;
    ficha.append(nom, monto, det);
  }

  // Tiempo: se reproduce solo al cargar; el deslizador permite ir a cualquier año.
  rango.max = cortes - 1;
  let reproduciendo = !quieto, t0 = performance.now(), desde = momento;
  const DURA = 4.5;
  rango.addEventListener("input", () => { reproduciendo = false; momento = +rango.value; construir(momento); });
  play.addEventListener("click", () => { reproduciendo = true; desde = 0; t0 = performance.now(); });
  construir(momento);
  rango.value = Math.round(momento);

  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function elegir(ev) {
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camara);
    const hit = ray.intersectObjects([mBase, mOro])[0];
    if (hit) {
      const i = (hit.object === mOro ? duenoOro : duenoBase)[hit.instanceId];
      if (i !== sel) { sel = i; construir(momento); }
    }
  }
  renderer.domElement.addEventListener("pointermove", elegir);
  renderer.domElement.addEventListener("pointerdown", elegir);

  const v = new THREE.Vector3();
  let antes = performance.now();
  renderer.setAnimationLoop(() => {
    const ahora = performance.now(), dt = Math.min(0.05, (ahora - antes) / 1000); antes = ahora;
    if (reproduciendo) {
      momento = Math.min(cortes - 1, desde + ((ahora - t0) / 1000 / DURA) * (cortes - 1));
      construir(momento);
      rango.value = Math.round(momento);
      if (momento >= cortes - 1) reproduciendo = false;
    }
    if (!quieto) autos.forEach((a) => {
      const u = a.userData;
      u.x += u.dir * u.vel * dt;
      if (u.x > 16) u.x = -16; if (u.x < -16) u.x = 16;
      a.position.set(u.x, 0, u.carril);
    });
    else autos.forEach((a) => a.position.set(a.userData.x, 0, a.userData.carril));
    composer.render();
    const w = escena.clientWidth, h = escena.clientHeight;
    inst.forEach((d, i) => {
      v.set(pos[i].x, d.ahora.total * PISO + 0.5, pos[i].z).project(camara);
      etq[i].style.left = ((v.x + 1) / 2) * w + "px";
      etq[i].style.top = ((1 - v.y) / 2) * h + "px";
    });
  });
}

function clp(n) { return "$" + Math.round(n).toLocaleString("es-CL"); }
function corto(n) {
  return n >= 1e6 ? "$" + (n / 1e6).toFixed(1).replace(".", ",") + " M"
    : "$" + Math.round(n / 1e3).toLocaleString("es-CL") + " mil";
}
</script>
