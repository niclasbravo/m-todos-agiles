<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=localStorage.getItem("tema");if(t=="claro"||t=="oscuro")document.documentElement.dataset.theme=t=="oscuro"?"dark":"light"}catch(e){}</script>
<title>{% block titulo %}¿Dónde ahorro? Simulador de ahorro e inversión en Chile{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Geist:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ground:#f2f4f7;--surface:#ffffff;--raised:#eef0f3;--border:#e4e7ec;--rule:#eef0f3;--control:#8c8f94;--text:#0a0a0a;--muted:#5f6368;--primary:#141414;--hue:#9a6c00;--data-ink:#141414;--data-grey:#9aa0a6;--positive:#247b50;--negative:#c4242a;--warning-ink:#92400e;--warning-bg:#fffbeb;--warning-border:#fde68a;--real:#c4242a;--serie-pones:#3b6aa8;--serie-gana:#b37a00;--efectivo:#0f766e;--azul:var(--hue);--gana:var(--hue);--ink:var(--text);--mute:var(--muted);--line:var(--border);--card:var(--surface);--bg:var(--ground);--button-label:#fff;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ground:#0b0b0c;--surface:#151517;--raised:#1f1f22;--border:#2a2a2e;--rule:#232326;--control:#6e6e74;--text:#f5f5f5;--muted:#b4b4b4;--primary:#f5f5f5;--hue:#e0b347;--data-ink:#e6e6e6;--data-grey:#6e6e74;--positive:#3fc07a;--negative:#ff7b71;--warning-ink:#e3a94a;--warning-bg:#1f1a10;--warning-border:#4a3a17;--real:#ff7b71;--serie-pones:#5f8fd6;--serie-gana:#bd8a22;--efectivo:#4fb8ac;--button-label:#0b0b0c}}
:root[data-theme=dark]{--ground:#0b0b0c;--surface:#151517;--raised:#1f1f22;--border:#2a2a2e;--rule:#232326;--control:#6e6e74;--text:#f5f5f5;--muted:#b4b4b4;--primary:#f5f5f5;--hue:#e0b347;--data-ink:#e6e6e6;--data-grey:#6e6e74;--positive:#3fc07a;--negative:#ff7b71;--warning-ink:#e3a94a;--warning-bg:#1f1a10;--warning-border:#4a3a17;--real:#ff7b71;--serie-pones:#5f8fd6;--serie-gana:#bd8a22;--efectivo:#4fb8ac;--button-label:#0b0b0c;color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;background:var(--ground);color:var(--text);font:15px/1.55 "Geist",system-ui,-apple-system,"Segoe UI",sans-serif}
input,select,button{font:inherit}
a{color:var(--text);text-decoration:underline;text-underline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:24px 24px 64px;min-width:0}
.topbar{height:56px;padding-top:0;padding-bottom:0;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--border)}
.wordmark{font-weight:700;white-space:nowrap}
.topbar nav{display:flex;gap:20px;align-items:center}
.topbar a{display:inline-flex;align-items:center;min-height:44px;font-size:13px}
.topbar a[aria-current=page]{font-weight:600}
h1{font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:0 0 8px;max-width:26ch}
h2{font-size:18px;line-height:1.35;font-weight:600;margin:0 0 8px}
h3{font-size:16px;font-weight:600;margin:0}
.lead{color:var(--muted);max-width:62ch;margin:0 0 28px}
.grid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:28px;align-items:start}
.grid>*{min-width:0}
form,.nada,.rec,.proy,.grafico{background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:none}
form{padding:18px;position:sticky;top:16px}
form p{margin:0 0 14px}
label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:4px}
input,select{width:100%;min-width:0;height:40px;padding:8px 10px;border:1px solid var(--control);border-radius:6px;background:var(--surface);color:var(--text)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
button,a.btn,button.link{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 16px;border:1px solid var(--primary);border-radius:6px;background:var(--primary);color:var(--button-label);font-weight:600;text-decoration:none;cursor:pointer;max-width:100%}
button{width:100%}
a.btn,button.link{margin-right:16px}
button.link{width:auto}
a.btn.sec,button.link.sec{background:transparent;border:1px solid var(--control);color:var(--text)}
:focus-visible{outline:2px solid var(--hue);outline-offset:2px}
.errorlist{list-style:none;margin:0 0 10px;padding:0;color:var(--negative);font-size:13px}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin:0 0 18px}
.sw{display:inline-block;width:12px;height:12px;margin-right:6px;border-radius:2px;vertical-align:-1px}
.fila{padding:16px 0;border-top:1px solid var(--border)}
.fila header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 12px;align-items:baseline;margin-bottom:10px}
.tag{font-size:13px;color:var(--muted)}
.barra{display:flex;position:relative;height:12px;background:var(--raised);border-radius:2px}
.barra .a{background:var(--data-ink);border-radius:2px 0 0 2px}
.barra .g{background:var(--hue)}
.barra i{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-2px;background:var(--real);border-radius:2px}
.nums{display:flex;flex-wrap:wrap;gap:2px 20px;align-items:baseline;margin-top:10px;color:var(--muted);font-size:13px}
.nums strong{font-size:26px;font-weight:700;color:var(--text)}
.nums,.tabla,.tag,svg text,input,select{font-variant-numeric:tabular-nums}
.meta{margin:6px 0 0;color:var(--muted);font-size:13px;max-width:70ch}
details{margin-top:24px;color:var(--muted);font-size:13px;max-width:70ch;min-width:0}
summary{cursor:pointer}
.destacada{border-left:3px solid var(--text);padding-left:14px}
.nada{border-left:4px solid var(--efectivo);padding:16px 18px;margin:0 0 22px;max-width:70ch}
.nada p{margin:0 0 8px}
.nada .barra .a{background:var(--efectivo)}
.quiz,.reco{max-width:820px;position:static}
main.wrap:has(.quiz),main.wrap:has(.reco){max-width:1120px}
.quiz fieldset{border:0;padding:0;margin:0 0 22px;min-width:0}
.quiz legend{font-size:16px;line-height:1.35;font-weight:600;margin-bottom:10px;padding:0}
.op{display:flex;gap:10px;align-items:center;color:var(--text);font-size:15px;min-height:44px;padding:10px 12px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;cursor:pointer}
.quiz input[type=radio]{width:18px;height:18px;flex:0 0 18px;margin:0;accent-color:var(--text)}
.quiz input[type=radio]:checked{outline:1px solid var(--text);outline-offset:2px}
.op:has(input:checked){border:1.5px solid var(--text);background:var(--raised)}
.reco h2{margin:0}
.rec{padding:18px;margin:16px 0}
.razones{margin:8px 0 0;padding-left:20px}
.razones li{margin-bottom:4px}
.aviso{background:var(--warning-bg);color:var(--warning-ink);border:1px solid var(--warning-border);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:13px;max-width:820px}
.aviso.ok{background:var(--surface);color:var(--muted);border-color:var(--border)}
.desc{margin:6px 0 0;padding-left:20px;color:var(--muted);font-size:13px}
.desc strong{color:var(--text)}
.acciones{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:22px 0 10px}
.sel{border-left:3px solid var(--text)}
.proy{margin:28px 0 8px;padding:18px;min-width:0}
.proy h2{margin:0 0 6px}
.grafico{overflow:hidden;margin:10px 0;padding:8px;min-width:0}
.grafico svg{display:block;width:100%;max-width:720px;height:auto}
.grafico .grid{stroke:var(--border);stroke-width:1}
.grafico .eje{fill:var(--muted);font-size:12px}
.grafico .l{fill:none;stroke-linejoin:round;stroke-linecap:round}
.grafico .l-nom{stroke:var(--hue);stroke-width:2.5}
.grafico .l-real{stroke:var(--real);stroke-width:2}
.grafico .l-apor{stroke:var(--data-grey);stroke-width:2;stroke-dasharray:6 5}
.grafico .l-efec{stroke:var(--efectivo);stroke-width:2;stroke-dasharray:2 6}
.grafico .et{font-size:13px;font-weight:500}
.et-nom{fill:var(--hue)}.et-real{fill:var(--real)}.et-apor{fill:var(--data-grey)}.et-efec{fill:var(--efectivo)}
.hv{fill:transparent;stroke:transparent}.hv:hover{stroke:var(--text);fill:var(--surface)}
.ln{display:inline-block;width:24px;border-top:2px solid;vertical-align:middle;margin-right:6px}
.ln.nom{border-color:var(--hue);border-top-width:2.5px}.ln.real{border-color:var(--real)}.ln.apor{border-color:var(--data-grey);border-top-style:dashed}.ln.efec{border-color:var(--efectivo);border-top-style:dotted}
.ajuste{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:14px 0;max-width:100%;position:static}
.ajuste p{margin:0;min-width:0;flex:1 1 150px}
.ajuste input{width:100%}.ajuste button{width:auto}
.tabla-scroll{max-width:100%;overflow-x:auto}
.tabla{border-collapse:collapse;font-size:13px;margin-top:8px}
.tabla th[scope=row]{white-space:nowrap}
.tabla th,.tabla td{padding:8px 12px;border-bottom:1px solid var(--rule);text-align:right;font-weight:400}
.tabla thead th{color:var(--muted);font-size:13px}
.tabla th:first-child,.tabla td:first-child{text-align:left}
@media(max-width:820px){.grid{grid-template-columns:1fr}form{position:static}}
@media(max-width:600px){.wrap{padding:24px 16px 64px}.topbar{padding-top:0;padding-bottom:0;gap:10px}.topbar nav{gap:12px}.wordmark{font-size:14px}h1{font-size:24px}.rec,.proy{padding:14px}.grafico{padding:2px}.tag{white-space:normal}.acciones a{margin-right:0}.nums{gap:4px 12px}}
/* Chips, tarjetas del simulador y bloque "sin invertir". */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:3px 10px;border-radius:99px;background:var(--raised);color:var(--text);font-size:12px;font-weight:500;line-height:1.3}
.chip.oro{background:color-mix(in srgb,#f2b937 22%,var(--surface));color:var(--text);font-weight:700}
.chip.negativo{background:color-mix(in srgb,var(--negative) 14%,var(--surface));color:var(--negative);font-weight:700}
.chips,.nada-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.tarjetas-sim{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:8px}
.tarjetas-sim .fila{display:flex;flex-direction:column;gap:12px;padding:18px;border:1px solid var(--border);border-radius:12px;background:var(--surface);
  transition:transform 200ms var(--ease-out),border-color 200ms ease,box-shadow 200ms ease}
.tarjetas-sim .fila header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin:0}
.tarjetas-sim .fila h3{font-size:15px;line-height:1.3}
.tarjetas-sim .nums{margin:0;gap:2px 12px}
.tarjetas-sim .nums strong{font-size:28px;letter-spacing:-.02em}
.tarjetas-sim .barra{height:8px;border-radius:99px;overflow:visible}
.tarjetas-sim .barra .a{border-radius:99px 0 0 99px}.tarjetas-sim .barra .g{border-radius:0 99px 99px 0}
.real-txt{margin:0;font-size:13px;color:var(--muted)}
.real-txt b{color:var(--text);font-variant-numeric:tabular-nums}
.detalle{margin:auto 0 0;max-width:none;font-size:13px}
.detalle summary{color:var(--text);font-weight:600;font-size:13px;list-style:none;display:inline-flex;align-items:center;gap:6px;min-height:32px}
.detalle summary::-webkit-details-marker{display:none}
.detalle summary::after{content:"";width:7px;height:7px;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:translateY(-2px) rotate(45deg);transition:transform 200ms var(--ease-out)}
.detalle[open] summary::after{transform:translateY(1px) rotate(-135deg)}
.tarjetas-sim .fila.destacada{border:2px solid #d99a00;padding:17px;padding-left:17px}
.insignia{flex:none;padding:3px 9px;border-radius:99px;background:#d99a00;color:#fff;font-size:11px;font-weight:700;white-space:nowrap}
@media(hover:hover) and (pointer:fine){.tarjetas-sim .fila:hover{transform:translateY(-3px);border-color:var(--control);box-shadow:0 10px 24px rgba(15,23,42,.08)}}
@media(max-width:700px){.tarjetas-sim{grid-template-columns:1fr}}
.nada{padding:20px 22px;max-width:none}
.nada.con-3d{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:center}
.estante{position:relative;height:300px;border-radius:10px;background:color-mix(in srgb,var(--raised) 60%,var(--surface))}
.estante canvas{display:block;width:100%;height:100%}
.estante-reloj{position:absolute;left:12px;top:10px;margin:0;display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;pointer-events:none}
.estante-reloj b{font:800 22px/1 "Bricolage Grotesque",Geist,system-ui,sans-serif;color:var(--text);letter-spacing:-.02em}
.nada.con-3d .billete{display:none}
.nada.con-3d .nada-comp{align-items:start}
@media(max-width:900px){.nada.con-3d{grid-template-columns:1fr}.estante{height:240px}}
.nada h2{margin:0 0 14px}
.nada-comp{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:16px;margin-bottom:14px}
.nada-col{display:flex;flex-direction:column;gap:2px;min-width:0}
.nada-et{font-size:12px;color:var(--muted)}
.nada-col strong{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.nada-col strong.pierde{color:var(--negative)}
.billete{position:relative;display:block;margin-top:10px;width:180px;max-width:100%;aspect-ratio:2.1;border-radius:8px;background:color-mix(in srgb,var(--efectivo) 22%,var(--surface));border:1.5px solid color-mix(in srgb,var(--efectivo) 55%,var(--surface))}
.billete i{position:absolute;inset:0;display:grid;place-items:center;font:800 26px/1 "Bricolage Grotesque",Geist,sans-serif;font-style:normal;color:var(--efectivo)}
.billete::before{content:"";position:absolute;inset:6px;border:1px dashed color-mix(in srgb,var(--efectivo) 45%,transparent);border-radius:5px}
.billete.chico{transform:scale(calc(var(--k) / 100));transform-origin:left bottom;opacity:.85;animation:encoger 900ms 300ms var(--ease-out) both}
@keyframes encoger{from{transform:scale(1);opacity:1}}
.nada-flecha{align-self:center;width:28px;height:2px;background:var(--control);position:relative;margin-bottom:30px}
.nada-flecha::after{content:"";position:absolute;right:-1px;top:-4px;width:8px;height:8px;border:solid var(--control);border-width:2px 2px 0 0;transform:rotate(45deg)}
.nada-mas{margin-top:12px;max-width:none}
.nada-mas summary{color:var(--text);font-weight:600}
.nada-mas p{margin:8px 0 0}
.nada .barra{display:none}
@media(max-width:600px){.nada-col strong{font-size:21px}.nada-comp{gap:10px}.nada-flecha{width:16px}}
@media(prefers-reduced-motion:reduce){.billete.chico{animation:none}.tarjetas-sim .fila{transition:none}}
/* Tabla de posiciones del simulador (paleta de series validada con dataviz). */
.ranking{list-style:none;margin:0 0 12px;padding:0;border-top:1px solid var(--border)}
.puesto{display:grid;grid-template-columns:30px 34px minmax(0,1fr);gap:4px 14px;padding:18px 8px 16px;border-bottom:1px solid var(--border)}
.pos{font:800 24px/1 "Bricolage Grotesque",Geist,system-ui,sans-serif;letter-spacing:-.02em;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:3px}
.puesto:first-child .pos{color:var(--text)}
.picto svg{width:30px;height:30px;fill:none;stroke:var(--text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.linea1{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.linea1 h3{flex:1 1 220px;margin:0;font-size:15px;line-height:1.35}
.ranking .monto{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ranking .barra{display:flex;height:10px;margin:10px 0 8px;background:none;border-radius:0}
.ranking .barra .a{background:var(--serie-pones);border-radius:4px 0 0 4px}
.ranking .barra .g{background:var(--serie-gana);margin-left:2px;border-radius:0 4px 4px 0}
.ranking .barra i{top:-4px;bottom:-4px;width:2px;background:var(--real);box-shadow:0 0 0 2px var(--surface)}
.datos{margin:0;font-size:13px;color:var(--muted);max-width:64ch}
.pie{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px}
.detalle{margin:0;max-width:none;font-size:13px}
.detalle summary{color:var(--text);font-weight:600;font-size:13px;list-style:none;display:inline-flex;align-items:center;gap:6px;min-height:32px;cursor:pointer}
.detalle summary::-webkit-details-marker{display:none}
.detalle summary::after{content:"";width:7px;height:7px;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:translateY(-2px) rotate(45deg);transition:transform 200ms var(--ease-out)}
.detalle[open] summary::after{transform:translateY(1px) rotate(-135deg)}
.ver-mapa{width:auto;min-height:32px;padding:4px 0;font-size:13px;font-weight:600;background:none;color:var(--text);border:0;border-radius:0;text-decoration:underline;text-underline-offset:3px}
.puesto.destacada{background:color-mix(in srgb,var(--serie-gana) 7%,var(--surface))}
.insignia{flex:none;padding:2px 8px;border-radius:4px;background:var(--text);color:var(--surface);font-size:11px;font-weight:700;white-space:nowrap}
.leyenda .sw.tick{width:3px;border-radius:1px}
.por-ver .puesto .barra span{transform:scaleX(0);transform-origin:left center}
.por-ver.visto .puesto .barra span{transform:none;transition:transform 800ms var(--ease-out) var(--retraso,0ms)}
.por-ver .puesto .barra i{opacity:0}
.por-ver.visto .puesto .barra i{opacity:1;transition:opacity 300ms ease calc(var(--retraso,0ms) + 700ms)}
@media(max-width:600px){.puesto{grid-template-columns:24px 26px minmax(0,1fr);gap:4px 10px;padding:16px 4px}.picto svg{width:24px;height:24px}.ranking .monto{font-size:21px}}
/* Revelado al hacer scroll (solo con JavaScript: la clase .por-ver la pone el script). */
.por-ver{opacity:0;transform:translateY(18px)}
.por-ver.visto{opacity:1;transform:none;transition:opacity 500ms var(--ease-out) var(--retraso,0ms),transform 500ms var(--ease-out) var(--retraso,0ms)}
.por-ver .barra span,.por-ver .barra i{transform:scaleX(0);transform-origin:left center}
.por-ver.visto .barra span{transform:none;transition:transform 900ms var(--ease-out) calc(var(--retraso,0ms) + 200ms)}
.por-ver .barra i{opacity:0}
.por-ver.visto .barra i{opacity:1;transform:none;transition:opacity 300ms ease calc(var(--retraso,0ms) + 900ms)}
.por-ver .billete.chico{animation-play-state:paused}
.por-ver.visto .billete.chico{animation-play-state:running}
@media(prefers-reduced-motion:reduce){.por-ver,.por-ver .barra span,.por-ver .barra i{opacity:1;transform:none}}
/* Botón de tema: luna en claro, sol en oscuro. */
.topbar .tema{width:40px;min-height:40px;padding:0;display:inline-grid;place-items:center;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:99px}
.topbar .tema span{grid-area:1/1;transition:opacity 200ms ease,transform 300ms var(--ease-out)}
.topbar .tema .luna{width:15px;height:15px;border-radius:50%;box-shadow:inset -5px -3px 0 0 currentColor}
.topbar .tema .sol{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 -7px 0 -2.5px currentColor,0 7px 0 -2.5px currentColor,7px 0 0 -2.5px currentColor,-7px 0 0 -2.5px currentColor,5px 5px 0 -2.5px currentColor,-5px -5px 0 -2.5px currentColor,5px -5px 0 -2.5px currentColor,-5px 5px 0 -2.5px currentColor}
.topbar .tema .sol{opacity:0;transform:rotate(-90deg) scale(.6)}
:root[data-theme=dark] .topbar .tema .luna{opacity:0;transform:rotate(90deg) scale(.6)}
:root[data-theme=dark] .topbar .tema .sol{opacity:1;transform:none}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .topbar .tema .luna{opacity:0;transform:rotate(90deg) scale(.6)}:root:not([data-theme=light]) .topbar .tema .sol{opacity:1;transform:none}}
body{transition:background-color 250ms ease,color 250ms ease}
/* Movimiento: curvas propias, respuesta al presionar y entradas cortas (sin animar lo que se usa a cada rato). */
:root{--ease-out:cubic-bezier(.23,1,.32,1)}
button,a.btn,button.link,.tiempo .play{transition:transform 160ms var(--ease-out),background-color 160ms ease,border-color 160ms ease}
button:active,a.btn:active,button.link:active,.tiempo .play:active{transform:scale(.97)}
.op{transition:border-color 150ms ease,background-color 150ms ease}
.op:active{transform:scale(.99)}
@media(hover:hover) and (pointer:fine){
  a.btn.sec:hover,button.link.sec:hover{border-color:var(--text)}
  .op:hover{border-color:var(--control)}
  .topbar a:hover{text-decoration-thickness:2px}
}
.fila{animation:entrar 320ms var(--ease-out) both}
.fila:nth-of-type(2){animation-delay:50ms}.fila:nth-of-type(3){animation-delay:100ms}.fila:nth-of-type(4){animation-delay:150ms}
.fila:nth-of-type(5){animation-delay:200ms}.fila:nth-of-type(6){animation-delay:250ms}.fila:nth-of-type(n+7){animation-delay:300ms}
@keyframes entrar{from{opacity:0;transform:translateY(8px)}}
.ficha{transition:filter 200ms ease,opacity 200ms ease}
.ficha.cambia{filter:blur(2px);opacity:.7;transition:none}
@media(prefers-reduced-motion:reduce){
  .fila{animation:aparecer 200ms ease both}
  @keyframes aparecer{from{opacity:0}}
  button:active,a.btn:active,button.link:active,.op:active,.tiempo .play:active{transform:none}
}
</style>{% block extra_css %}{% endblock %}
</head>
<body>
<header class="wrap topbar">
  <span class="wordmark">¿Dónde ahorro?</span>
  <nav aria-label="Principal">
    <a href="{% url 'simulador' %}"{% if request.path == '/' %} aria-current="page"{% endif %}>Simulador</a>
    <a href="{% url 'quiz' %}"{% if request.path == '/recomendador/' %} aria-current="page"{% endif %}>Quiz de perfil</a>
    <button type="button" class="tema" id="tema" aria-label="Cambiar a tema oscuro">
      <span class="luna" aria-hidden="true"></span>
      <span class="sol" aria-hidden="true"></span>
    </button>
  </nav>
</header>
<main class="wrap">{% block contenido %}{% endblock %}</main>
{% block scripts %}{% endblock %}
<script>
(function () {
  // Tema claro/oscuro: recuerda la elección en este navegador; sin elección sigue al sistema.
  var boton = document.getElementById("tema"); if (!boton) return;
  var raiz = document.documentElement, sistema = matchMedia("(prefers-color-scheme: dark)");
  function actual() { return raiz.dataset.theme || (sistema.matches ? "dark" : "light"); }
  function rotular() {
    var oscuro = actual() === "dark";
    boton.setAttribute("aria-label", oscuro ? "Cambiar a tema claro" : "Cambiar a tema oscuro");
    boton.title = oscuro ? "Tema claro" : "Tema oscuro";
  }
  boton.addEventListener("click", function () {
    var nuevo = actual() === "dark" ? "light" : "dark";
    raiz.dataset.theme = nuevo;
    try { localStorage.setItem("tema", nuevo === "dark" ? "oscuro" : "claro"); } catch (e) {}
    rotular();
  });
  sistema.addEventListener("change", rotular);
  rotular();
})();
</script>
</body>
</html>
