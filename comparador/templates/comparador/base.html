<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}¿Dónde ahorro? Simulador de ahorro e inversión en Chile{% endblock %}</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#13202e;--mute:#586679;--line:#d9dfe7;--azul:#1b3fa0;--gana:#2a8c68;--real:#c9372c;--efectivo:#9a5b00;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0e1621;--card:#162130;--ink:#e9eef4;--mute:#9aa9ba;--line:#2a384b;--azul:#7f9dff;--gana:#4cc59b;--real:#ff7b71;--efectivo:#e3a94a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:32px 20px 56px}
h1{font:600 clamp(1.8rem,4vw,2.6rem)/1.15 Georgia,"Times New Roman",serif;margin:0 0 8px;max-width:22ch}
h2{font:600 1.25rem/1.3 Georgia,serif;margin:0 0 8px}
h3{font-size:1rem;margin:0}
.lead{color:var(--mute);max-width:62ch;margin:0 0 28px}
.grid{display:grid;grid-template-columns:290px 1fr;gap:28px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}form{position:static!important}}
form{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;position:sticky;top:16px}
form p{margin:0 0 14px}
label{display:block;font-size:.88rem;color:var(--mute);margin-bottom:4px}
input,select{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{width:100%;font:inherit;font-weight:600;padding:10px;border:0;border-radius:6px;background:var(--azul);color:#fff;cursor:pointer}
@media(prefers-color-scheme:dark){button{color:#0e1621}}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.errorlist{list-style:none;margin:0 0 10px;padding:0;color:var(--real);font-size:.9rem}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem;color:var(--mute);margin:0 0 18px}
.sw{display:inline-block;width:12px;height:12px;margin-right:6px;border-radius:2px;vertical-align:-1px}
.fila{padding:16px 0;border-top:1px solid var(--line)}
.fila header{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:10px}
.tag{font-size:.8rem;color:var(--mute);white-space:nowrap}
.barra{display:flex;position:relative;height:16px;background:var(--line);border-radius:3px}
.barra .a{background:var(--azul);border-radius:3px 0 0 3px}
.barra .g{background:var(--gana)}
.barra i{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-2px;background:var(--real);border-radius:2px}
.nums{display:flex;flex-wrap:wrap;gap:2px 20px;align-items:baseline;margin-top:10px;color:var(--mute);font-size:.9rem}
.nums strong{font:600 1.35rem Georgia,serif;color:var(--ink)}
.meta{margin:6px 0 0;color:var(--mute);font-size:.88rem;max-width:70ch}
details{margin-top:24px;color:var(--mute);font-size:.9rem;max-width:70ch}
.destacada{border-left:4px solid var(--azul);padding-left:14px}
.lead a{color:var(--azul)}
.nada{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--efectivo);border-radius:8px;padding:16px 18px;margin:0 0 22px;max-width:70ch}
.nada p{margin:0 0 8px}
.nada .barra .a{background:var(--efectivo)}
</style>{% block extra_css %}{% endblock %}
</head>
<body>
<main class="wrap">{% block contenido %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body>
</html>
