# Compila la app móvil y deja el APK de Android listo para descargar (pestaña Actions → la ejecución → Artifacts).
name: App móvil (APK)

on:
  push:
    paths: ["movil/**", "comparador/**", ".github/workflows/apk-movil.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: movil/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Pruebas: reglas de negocio + paridad exacta con la lógica Python de la web.
      - run: python3 scripts/generar_paridad.py .. && npm test
      - run: npm run build && npx cap sync android
      - name: Compilar APK de prueba
        working-directory: movil/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: donde-ahorro-apk
          path: movil/android/app/build/outputs/apk/debug/app-debug.apk
